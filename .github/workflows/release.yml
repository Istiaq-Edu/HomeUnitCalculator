name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 6.2.0)"
        required: true
        type: string

# Serialize release runs: concurrent releases could race on tags,
# changelog commits, and release assets.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Validate the version, pin one immutable commit SHA,
  #         create and push the tag, create the draft GitHub
  #         Release with a git-cliff changelog
  # ──────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
      version: ${{ steps.get_version.outputs.VERSION }}
      sha: ${{ steps.resolve_sha.outputs.SHA }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: get_version
        env:
          RAW_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          # Build metadata (+...) is rejected: it would leak into asset
          # filenames and the Inno VersionInfoVersion.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version '$VERSION' is not a valid semantic version (e.g. 6.2.0 or 6.2.0-beta.1)." >&2
            exit 1
          fi
          if echo "$VERSION" | grep -qi "beta\|alpha\|rc"; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          # Releases are immutable: fail closed when the tag already exists.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; refusing to overwrite an existing release tag." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release SHA
        id: resolve_sha
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release pinned to commit $SHA"

      - name: Create and push the release tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          SHA: ${{ steps.resolve_sha.outputs.SHA }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}" "${SHA}"
          git push origin "v${VERSION}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
          RELEASE_SHA: ${{ steps.resolve_sha.outputs.SHA }}
          CHANGELOG: ${{ steps.git-cliff.outputs.content }}
        with:
          script: |
            // Values arrive through the environment (REL-01): generated
            // changelog text containing backticks or ${} sequences cannot
            // break this script because it is never interpolated into the
            // script source.
            const version = process.env.RELEASE_VERSION;
            const sha = process.env.RELEASE_SHA;
            const changelog = process.env.CHANGELOG && process.env.CHANGELOG.trim()
              ? process.env.CHANGELOG
              : 'See commit history for changes in this release.';
            const isPre = version.includes('beta') || version.includes('alpha') || version.includes('rc');
            const intro = `HomeUnitCalculator v${version} — ${isPre ? 'Pre-release for testing and feedback.' : 'Stable release.'}\n\n${isPre ? '**Note:** This is a pre-release. Some features may be incomplete or unstable. Please report any issues.' : ''}\n\nCommit: ${sha}`;
            const body = [
              intro,
              '',
              '---',
              '',
              '## What Changed',
              '',
              changelog,
              '',
              '---',
              '',
              '### Downloads',
              '',
              `- **Installer** (HomeUnitCalculator-Setup-${version}.exe) — recommended for most users. Run it to install the app.`,
              `- **Portable ZIP** (HomeUnitCalculator-Portable-${version}.zip) — no installation needed. Extract and run HomeUnitCalculator.exe.`,
              `- **Checksums** (checksums-${version}.txt) — SHA256 hashes to verify your download.`,
              '',
              '> **Requirements:** Windows 10/11 (64-bit)'
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: sha,
              name: `HomeUnitCalculator v${version}`,
              body: body,
              draft: true,
              prerelease: isPre
            });
            return data.id;

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Build the Windows app (PyInstaller + Inno Setup) from
  #         the pinned release SHA and upload installer, portable
  #         zip, and checksums to the draft release
  # ──────────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Write OAuth credentials from GitHub Secrets
        env:
          OAUTH_CLIENT_ID_VALUE: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.OAUTH_CLIENT_SECRET }}
        shell: pwsh
        run: |
          "OAUTH_CLIENT_ID = '$env:OAUTH_CLIENT_ID_VALUE'" | Set-Content -Path src/core/oauth_credentials.py -Encoding utf8
          Add-Content -Path src/core/oauth_credentials.py -Value "OAUTH_CLIENT_SECRET = '$env:OAUTH_CLIENT_SECRET_VALUE'" -Encoding utf8

      - name: Generate icon.ico
        run: python tools/make_icon_ico.py

      - name: Set build version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $parts = $version.Split('-')[0].Split('.')
          if ($parts.Count -lt 3) { $version = "$version.0" }
          $versionInfo = "$($parts[0..2] -join '.').0"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$version"
          Add-Content $env:GITHUB_ENV "APP_VERSION_INFO=$versionInfo"

      - name: Build one-directory executable
        run: python -m PyInstaller -y HomeUnitCalculator.spec

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $proc = Start-Process "dist\HomeUnitCalculator\HomeUnitCalculator.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Packaged app exited early with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HomeUnitCalculator\*" `
            -DestinationPath "dist\HomeUnitCalculator-Portable-$env:APP_VERSION.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          iscc "installer\HomeUnitCalculator.iss" `
            /DMyAppVersion="$env:APP_VERSION" `
            /DMyAppVersionInfo="$env:APP_VERSION_INFO"

      - name: Assert exact installer output (REL-03)
        shell: pwsh
        run: |
          # installer/HomeUnitCalculator.iss sets OutputBaseFilename to
          # HomeUnitCalculator-Setup-{version} and OutputDir to
          # ..\dist\installer, so the name is deterministic.
          $expected = "HomeUnitCalculator-Setup-$env:APP_VERSION.exe"
          $exes = Get-ChildItem "dist\installer\*.exe" -ErrorAction SilentlyContinue
          if (-not $exes) { throw "No installer EXE found in dist\installer\" }
          if ($exes.Count -ne 1) { throw "Expected exactly one installer EXE, found $($exes.Count)" }
          if ($exes[0].Name -ne $expected) {
            throw "Unexpected installer name '$($exes[0].Name)'; expected '$expected'"
          }

      - name: Generate SHA256 checksums (REL-03)
        shell: pwsh
        run: |
          $portable = "dist\HomeUnitCalculator-Portable-$env:APP_VERSION.zip"
          $installer = "dist\installer\HomeUnitCalculator-Setup-$env:APP_VERSION.exe"
          $checksums = "dist\checksums-$env:APP_VERSION.txt"
          $lines = @()
          foreach ($f in @($portable, $installer)) {
            if (!(Test-Path $f)) { throw "Missing build output: $f" }
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path $checksums -Value $lines -Encoding ascii

      - name: Upload and verify assets (REL-02, REL-03)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:RELEASE_VERSION
          $portable = "dist\HomeUnitCalculator-Portable-$v.zip"
          $installer = "dist\installer\HomeUnitCalculator-Setup-$v.exe"
          $checksums = "dist\checksums-$v.txt"
          $expected = @(
            (Split-Path $portable -Leaf),
            (Split-Path $installer -Leaf),
            (Split-Path $checksums -Leaf)
          )

          # --- Resolve the release; fail closed on ambiguity ---
          $releaseId = $env:RELEASE_ID
          gh api "repos/$($env:REPO)/releases/$releaseId" > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            $tag = "v$v"
            $releaseId = gh api "repos/$($env:REPO)/releases/tags/$tag" --jq ".id" 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve release by ID ($env:RELEASE_ID) or tag ($tag): $releaseId"
            }
            Write-Host "Found release by tag, ID: $releaseId"
          }

          $uploadUrl = (gh api "repos/$($env:REPO)/releases/$releaseId" --jq ".upload_url") -replace '\{.*\}', ''
          if (!$uploadUrl) { throw "Could not get upload_url for release $releaseId" }
          Write-Host "Upload URL: $uploadUrl"

          # --- Narrow replacement: delete ONLY assets this manifest replaces ---
          $existing = gh api "repos/$($env:REPO)/releases/$releaseId/assets" --jq ".[] | [.name, .url] | @tsv" 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Could not list existing release assets" }
          if ($existing) {
            foreach ($line in $existing) {
              $parts = $line -split "`t", 2
              if ($expected -contains $parts[0]) {
                Write-Host "Deleting existing asset: $($parts[0])"
                gh api -X DELETE $parts[1] 2>$null
                if ($LASTEXITCODE -ne 0) { throw "Failed deleting existing asset $($parts[0])" }
              } else {
                Write-Host "Keeping unrelated asset: $($parts[0])"
              }
            }
          }

          # --- Upload every manifest entry, checking each exit code ---
          foreach ($f in @($portable, $installer, $checksums)) {
            if (!(Test-Path $f)) { throw "Missing expected asset file: $f" }
            $name = Split-Path $f -Leaf
            $contentType = "application/octet-stream"
            if ($name.EndsWith(".zip")) { $contentType = "application/zip" }
            if ($name.EndsWith(".exe")) { $contentType = "application/vnd.microsoft.portable-executable" }
            Write-Host "Uploading $name ..."
            gh api --method POST "${uploadUrl}?name=$name" `
              -H "Content-Type: $contentType" `
              --input $f --silent | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Upload failed for $name" }
          }

          # --- Final verification: exact manifest, sizes match local files ---
          $assets = gh api "repos/$($env:REPO)/releases/$releaseId/assets" --jq ".[] | [.name, .size] | @tsv"
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets after upload" }
          $names = @()
          foreach ($line in $assets) {
            $parts = $line -split "`t", 2
            $names += $parts[0]
            $local = $null
            foreach ($f in @($portable, $installer, $checksums)) {
              if ((Split-Path $f -Leaf) -eq $parts[0]) { $local = $f }
            }
            if (!$local) { throw "Unexpected asset on release: $($parts[0])" }
            $localSize = (Get-Item $local).Length
            if ([long]$parts[1] -ne $localSize) {
              throw "Size mismatch for $($parts[0]): remote $($parts[1]) vs local $localSize"
            }
          }
          foreach ($e in $expected) {
            if ($names -notcontains $e) { throw "Expected asset missing on release: $e" }
          }
          Write-Host "Release assets verified: $($names -join ', ')"

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Update CHANGELOG.md on the default branch using the
  #         tag pushed by Job 1 (no second force-tag of HEAD)
  # ──────────────────────────────────────────────────────────────
  update-changelog:
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the release tag is visible
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Release tag v${VERSION} is not visible after checkout" >&2
            exit 1
          fi

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push CHANGELOG.md
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changelog changes to commit" && exit 0
          git commit -m "docs: update CHANGELOG.md for v${VERSION}"
          git push
