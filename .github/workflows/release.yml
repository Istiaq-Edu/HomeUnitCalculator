name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 6.2.0)"
        required: true
        type: string

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Create a draft GitHub Release with a git-cliff changelog
  # ──────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
      version: ${{ steps.get_version.outputs.VERSION }}
      changelog: ${{ steps.git-cliff.outputs.content }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qi "beta\|alpha\|rc"; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create local tag for git-cliff
        run: git tag -f "v${{ steps.get_version.outputs.VERSION }}"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = `${{ steps.get_version.outputs.VERSION }}`;
            const isPre = version.includes('beta') || version.includes('alpha') || version.includes('rc');
            const changelog = `${{ steps.git-cliff.outputs.content }}` || 'See commit history for changes in this release.';
            const intro = `HomeUnitCalculator v${version} — ${isPre ? 'Pre-release for testing and feedback.' : 'Stable release.'}\n\n${isPre ? '**Note:** This is a pre-release. Some features may be incomplete or unstable. Please report any issues.' : ''}`;
            const body = [
              intro,
              '',
              '---',
              '',
              '## What Changed',
              '',
              changelog,
              '',
              '---',
              '',
              '### Downloads',
              '',
              `- **Installer** (HomeUnitCalculator-Setup-${version}.exe) — recommended for most users. Run it to install the app.`,
              `- **Portable ZIP** (HomeUnitCalculator-Portable-${version}.zip) — no installation needed. Extract and run HomeUnitCalculator.exe.`,
              '',
              '> **Requirements:** Windows 10/11 (64-bit)'
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `HomeUnitCalculator v${version}`,
              body: body,
              draft: true,
              prerelease: isPre
            });
            return data.id;

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Build the Windows app (PyInstaller + Inno Setup)
  #         and upload installer + portable zip to the draft release
  # ──────────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate icon.ico
        run: python tools/make_icon_ico.py

      - name: Set build version
        shell: pwsh
        run: |
          $version = '${{ needs.create-release.outputs.version }}'
          $parts = $version.Split('-')[0].Split('.')
          if ($parts.Count -lt 3) { $version = "$version.0" }
          $versionInfo = "$($parts[0..2] -join '.').0"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$version"
          Add-Content $env:GITHUB_ENV "APP_VERSION_INFO=$versionInfo"

      - name: Build one-directory executable
        run: python -m PyInstaller -y HomeUnitCalculator.spec

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $proc = Start-Process "dist\HomeUnitCalculator\HomeUnitCalculator.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Packaged app exited early with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\HomeUnitCalculator\*" `
            -DestinationPath "dist\HomeUnitCalculator-Portable-${{ needs.create-release.outputs.version }}.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          iscc "installer\HomeUnitCalculator.iss" `
            /DMyAppVersion="$env:APP_VERSION" `
            /DMyAppVersionInfo="$env:APP_VERSION_INFO"

      - name: Upload assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ needs.create-release.outputs.release_id }}"
          $repo = "${{ github.repository }}"
          $apiBase = "https://api.github.com/repos/$repo/releases/$releaseId/assets"

          # --- Delete any existing assets with the same name (re-runs) ---
          $existing = gh api "repos/$repo/releases/$releaseId/assets" --jq ".[].name" 2>$null
          if ($existing) {
            $existing | ForEach-Object {
              Write-Host "Deleting existing asset: $_"
              $delUrl = (gh api "repos/$repo/releases/$releaseId/assets" --jq ".[] | select(.name==\"$_\") | .url") 2>$null
              if ($delUrl) { gh api -X DELETE $delUrl 2>$null }
            }
          }

          # --- Upload portable zip ---
          $portable = "dist\HomeUnitCalculator-Portable-${{ needs.create-release.outputs.version }}.zip"
          if (!(Test-Path $portable)) { throw "Portable zip not found: $portable" }
          $portableName = [System.IO.Path]::GetFileName($portable)
          Write-Host "Uploading $portableName ..."
          gh api --method POST "$apiBase?name=$portableName" `
            -H "Content-Type: application/zip" `
            --input $portable --silent | Out-Null

          # --- Upload installer ---
          $installer = Get-ChildItem "dist\installer\*.exe" | Select-Object -First 1
          if (!$installer) { throw "No installer EXE found in dist\installer\" }
          $installerName = $installer.Name
          Write-Host "Uploading $installerName ..."
          gh api --method POST "$apiBase?name=$installerName" `
            -H "Content-Type: application/vnd.microsoft.portable-executable" `
            --input $installer.FullName --silent | Out-Null

          Write-Host "All assets uploaded successfully."

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Update CHANGELOG.md on the default branch
  # ──────────────────────────────────────────────────────────────
  update-changelog:
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Create local tag for git-cliff
        run: git tag -f "v${{ needs.create-release.outputs.version }}"

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changelog changes to commit" && exit 0
          git commit -m "docs: update CHANGELOG.md for v${{ needs.create-release.outputs.version }}"
          git push
