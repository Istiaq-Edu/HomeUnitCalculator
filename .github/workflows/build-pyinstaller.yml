name: Build • PyInstaller (Fast Startup)

on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Keep in sync with project requirement

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Build-only tools
          pip install pyinstaller pillow
      
      - name: Build one-directory executable (optimized for fast startup)
        run: pyinstaller --noconsole --onedir --icon=icons/icon.png --add-data "icons;icons" src/core/HomeUnitCalculator.py

      - name: Create portable zip
        run: |
          Compress-Archive -Path "dist\\HomeUnitCalculator\\*" -DestinationPath "dist\\HomeUnitCalculator-Portable.zip"
        shell: pwsh
      
      - name: Upload artifact (portable directory)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-PyInstaller-Portable-${{ runner.os }}
          path: dist/HomeUnitCalculator-Portable.zip
