name: Build • PyInstaller (Fast Startup)

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      version:
        description: "App version (display). Example: 1.2.3"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Keep in sync with project requirement

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Build-only tools
          pip install pyinstaller pillow

      - name: Write OAuth credentials from GitHub Secrets
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          Set-Content -Path "src/core/oauth_credentials.py" -Value "OAUTH_CLIENT_ID = '$env:OAUTH_CLIENT_ID'"
          Add-Content -Path "src/core/oauth_credentials.py" -Value "OAUTH_CLIENT_SECRET = '$env:OAUTH_CLIENT_SECRET'"
        shell: pwsh

      - name: Generate icon.ico (for EXE + installer)
        run: python tools/make_icon_ico.py

      - name: Set build version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = $env:VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.$env:RUN_NUMBER" }
          $parts = $version.Split('.')
          if ($parts.Count -lt 3) { $version = "$version.0" }
          $versionInfo = "$version.0"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$version"
          Add-Content $env:GITHUB_ENV "APP_VERSION_INFO=$versionInfo"
        shell: pwsh
      
      - name: Build one-directory executable (optimized for fast startup)
        run: python -m PyInstaller -y HomeUnitCalculator.spec

      - name: Smoke test packaged app
        run: |
          $proc = Start-Process "dist\HomeUnitCalculator\HomeUnitCalculator.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Packaged app exited early with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
        shell: pwsh

      - name: Create portable zip
        run: |
          Compress-Archive -Path "dist\\HomeUnitCalculator\\*" -DestinationPath "dist\\HomeUnitCalculator-Portable.zip"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer (Setup.exe)
        run: |
          New-Item -ItemType Directory -Force -Path "dist\\installer" | Out-Null
          iscc "installer\\HomeUnitCalculator.iss" /DMyAppVersion="$env:APP_VERSION" /DMyAppVersionInfo="$env:APP_VERSION_INFO"
        shell: pwsh
      
      - name: Verify build outputs
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "dist\HomeUnitCalculator\HomeUnitCalculator.exe")) {
            throw "Missing build output: dist\HomeUnitCalculator\HomeUnitCalculator.exe"
          }
          if (-not (Test-Path "dist\HomeUnitCalculator-Portable.zip")) {
            throw "Missing build output: dist\HomeUnitCalculator-Portable.zip"
          }
          $installers = @(Get-ChildItem "dist\installer" -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly 1 installer EXE in dist\installer, found $($installers.Count)"
          }
          $expectedInstaller = "HomeUnitCalculator-Setup-$env:APP_VERSION.exe"
          if ($installers[0].Name -ne $expectedInstaller) {
            throw "Unexpected installer name: '$($installers[0].Name)', expected '$expectedInstaller'"
          }
          $checksumFile = "dist\checksums-$env:APP_VERSION.txt"
          $zipHash = (Get-FileHash "dist\HomeUnitCalculator-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  HomeUnitCalculator-Portable.zip" | Out-File -FilePath $checksumFile -Encoding utf8
          "$exeHash  $($installers[0].Name)" | Out-File -FilePath $checksumFile -Encoding utf8 -Append
          Get-Content $checksumFile
        shell: pwsh

      - name: Upload artifact (portable directory)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-PyInstaller-Portable-${{ runner.os }}
          path: dist/HomeUnitCalculator-Portable.zip

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-Installer-${{ runner.os }}
          path: dist/installer/*.exe

      - name: Upload artifact (checksums)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-Checksums-${{ runner.os }}
          path: dist/checksums-*.txt
