name: Build • PyInstaller (Fast Startup)

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      version:
        description: "App version (display). Example: 1.2.3"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Keep in sync with project requirement

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Build-only tools
          pip install pyinstaller pillow

      - name: Generate icon.ico (for EXE + installer)
        run: python tools/make_icon_ico.py

      - name: Set build version
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.${{ github.run_number }}" }
          $parts = $version.Split('.')
          if ($parts.Count -lt 3) { $version = "$version.0" }
          $versionInfo = "$version.0"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$version"
          Add-Content $env:GITHUB_ENV "APP_VERSION_INFO=$versionInfo"
        shell: pwsh
      
      - name: Build one-directory executable (optimized for fast startup)
        run: python -m PyInstaller -y HomeUnitCalculator.spec

      - name: Smoke test packaged app
        run: |
          $proc = Start-Process "dist\HomeUnitCalculator\HomeUnitCalculator.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Packaged app exited early with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
        shell: pwsh

      - name: Create portable zip
        run: |
          Compress-Archive -Path "dist\\HomeUnitCalculator\\*" -DestinationPath "dist\\HomeUnitCalculator-Portable.zip"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer (Setup.exe)
        run: |
          New-Item -ItemType Directory -Force -Path "dist\\installer" | Out-Null
          iscc "installer\\HomeUnitCalculator.iss" /DMyAppVersion="$env:APP_VERSION" /DMyAppVersionInfo="$env:APP_VERSION_INFO"
        shell: pwsh
      
      - name: Upload artifact (portable directory)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-PyInstaller-Portable-${{ runner.os }}
          path: dist/HomeUnitCalculator-Portable.zip

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-Installer-${{ runner.os }}
          path: dist/installer/*.exe
