name: Build • PyInstaller (Spec • Lean)

on:
  # Manual trigger to compare spec-based lean build results
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows • One-file EXE via .spec (Curated Qt)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # Keep in sync with project requirements

      - name: Install dependencies
        working-directory: HomeUnitCalculator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Build-only tools
          pip install pyinstaller

      - name: Build using curated .spec (lean Qt plugins)
        working-directory: HomeUnitCalculator
        run: pyinstaller HomeUnitCalculator.spec

      - name: Show dist contents and sizes
        working-directory: HomeUnitCalculator
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Sort-Object Length -Descending | Select-Object -First 30

      - name: Upload artifact (single EXE)
        uses: actions/upload-artifact@v4
        with:
          name: HomeUnitCalculator-PyInstaller-Spec-${{ runner.os }}
          path: HomeUnitCalculator/dist/HomeUnitCalculator.exe
